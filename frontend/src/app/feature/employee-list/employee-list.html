<div class="employee-list">

  <h2>Employee List</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Created Date</th>
      </tr>
    </thead>

   <tbody>
  @for (employee of employees; track $index) {
    <tr>
      <td>{{ employee.EmployeeId }}</td>
      <td>{{ employee.EmployeeName }}</td>
      <td>{{ employee.Email }}</td>
      <td>{{ employee.Phone }}</td>
      <td>{{ employee.CreatedDate | date:'dd-MM-yyyy' }}</td>
    </tr>
  }
</tbody>
  </table>

</div>

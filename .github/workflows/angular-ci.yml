name: Angular CI/CD

on:
  push:
    branches:
      - feature/feature5-cd

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: ng build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Angular build
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/frontend/browser

  deploy:name: Angular CI/CD

